[versions]
agp = "9.4.1"
# AGP's built-in Kotlin brings KGP 2.2.10 at runtime; the root build puts this newer KGP on the classpath instead.
kotlin = "2.4.21"
# Bundles ktlint 1.8.0, the version .githooks/pre-commit requires (ADR 0001). Bump both together.
kotlinter = "5.7.0"
core = "1.13.1"
annotation = "1.6.0"
junit = "4.13.2"
json = "20240303"

# 3.19's kotlin-bom 2.4.0 sets the build's kotlin-daemon-client to at least 2.4.0, so KGP (`kotlin`) must stay
# >= 2.4.0 or the Kotlin daemon fails (NoSuchMethodError).
dependencyAnalysis = "3.19.2"
# detekt 2.0 is still alpha (1.x has no AGP 9 support); quality-tooling ticket 08 moves it to stable.
detekt = "2.0.0-alpha.6"

[libraries]
# portal-commons modules: no version, because includeBuild("../portal-commons") substitutes them from source.
portal-commons = { group = "com.portal", name = "commons" }
portal-commons-android = { group = "com.portal", name = "commons-android" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
