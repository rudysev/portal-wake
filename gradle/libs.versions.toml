[versions]
agp = "9.2.1"
# Bundles ktlint 1.8.0, the version .githooks/pre-commit requires (ADR 0001). Bump both together.
kotlinter = "5.7.0"
core = "1.13.1"
annotation = "1.6.0"
vosk = "0.3.75"
junit = "4.13.2"
json = "20240303"

# Stay on 3.18.x while Kotlin is 2.2.x: 3.19's kotlin-bom 2.4.0 upgrades kotlin-daemon-client past KGP 2.2.10,
# and the Kotlin daemon fails (NoSuchMethodError).
dependencyAnalysis = "3.18.0"

[libraries]
# portal-commons modules: no version, because includeBuild("../portal-commons") substitutes them from source.
portal-commons = { group = "com.portal", name = "commons" }
portal-commons-android = { group = "com.portal", name = "commons-android" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
vosk-android = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
